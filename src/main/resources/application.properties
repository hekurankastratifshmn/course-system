spring.application.name=course-system

# Docker Compose reads these from the .env file.
# Inside the API container the database host name is mysql.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# The PDF is saved in this folder. MySQL stores only the file name.
course.storage.dir=storage
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.jackson.default-property-inclusion=non_null
spring.jackson.mapper.sort-properties-alphabetically=false
server.error.include-message=always
